# Every shipped logical key binding and key-hint group is declared here. Rust code
# implements commands and projections, never a second default key or hint table.

[[key_group]]
id = "builtin.editor.normal.group.files"
context = "editor"
mode = "normal"
prefix = "<leader> f"
label = "Files"
icon = "󰈞"
order = 10

[[key_group]]
id = "builtin.editor.normal.group.diagnostics"
context = "editor"
mode = "normal"
prefix = "<leader> d"
label = "Diagnostics"
icon = "󰒡"
order = 20

[[key_group]]
id = "builtin.editor.normal.group.language"
context = "editor"
mode = "normal"
prefix = "<leader> l"
label = "Language"
icon = "󰅩"
order = 30

