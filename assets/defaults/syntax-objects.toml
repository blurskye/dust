# Named definition and argument-list kinds in the bundled Tree-sitter grammars.
functions = [
  "function_definition", "function_item", "closure_expression", "function_declaration",
  "function_expression", "function", "function_def", "method", "singleton_method",
  "generator_function_declaration", "generator_function", "arrow_function",
  "method_definition", "method_declaration", "func_literal", "lambda_expression",
  "local_function_statement", "anonymous_function", "function_declaration_statement",
  "function_binding", "function_clause", "fun_expression", "lambda_literal",
]
classes = [
  "struct_item", "enum_item", "union_item", "impl_item", "trait_item", "mod_item",
  "class_definition", "class_declaration", "abstract_class_declaration", "class",
  "interface_declaration", "enum_declaration", "type_declaration", "type_spec",
  "struct_specifier", "union_specifier", "enum_specifier", "struct_declaration",
  "record_declaration", "object_definition", "trait_definition", "module_definition",
  "protocol_declaration", "extension_declaration",
]
argument_lists = [
  "parameters", "arguments", "type_arguments", "type_parameters", "closure_parameters",
  "formal_parameters", "parameter_list", "method_parameters", "lambda_parameters",
  "block_parameters", "argument_list", "value_arguments", "function_value_parameters",
]
# Fallback for grammars that do not give the body child a field name.
bodies = [
  "body", "block", "statement_block", "compound_statement", "class_body",
  "enum_body", "declaration_list", "field_declaration_list", "function_body", "template_body",
]
comments = ["comment", "line_comment", "block_comment", "comment_line", "documentation_comment"]
# Longest opening marker first; inner objects omit markers and surrounding space.
comment_markers = [
  ["<!--", "-->"], ["/**", "*/"], ["/*!", "*/"], ["/*", "*/"],
  ["(*", "*)"], ["--[[", "]]"], ["///", ""], ["//!", ""], ["//", ""],
  ["--", ""], ["#", ""], [";", ""], ["%", ""],
]
