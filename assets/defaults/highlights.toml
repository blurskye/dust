# Neovim's highlight groups: the names syntax captures, language-server tokens and themes share.
# `[defaults]` are Neovim's own default links and attributes (dumped from `nvim --clean` with
# scripts/nvim-highlights.lua), plus links from the older nvim-treesitter capture names. A theme's
# `[highlights]` table overrides any of them, and a group nothing defines falls back to its parent:
# `@function.method.call`, then `@function.method`, then `@function`.

# Groups that have no default but that captures and tokens produce, so themes can colour them.
names = [
  # Markdown groups Neovim themes colour per language, tried before the general group.
  "@markup.heading.1.markdown",
  "@markup.heading.2.markdown",
  "@markup.heading.3.markdown",
  "@markup.heading.4.markdown",
