# The start screen: a header, the workspace with its branch and changes, these actions in
# columns with their keys, and recent files and projects when there is room. A `logo` (block
# letters, say) is drawn above the header when the window has room for everything.
logo = ""
show_identity = true
identity = "⠿ dust"
show_version = true
version_format = "v{version}"
show_path = true
resize_message = "Dust — resize terminal"
content_width = 96
minimum_width = 20
minimum_height = 7

[[action]]
command = "workspace.file.find"
label = "Find File"

[[action]]
command = "file.new"
label = "New File"

[[action]]
command = "workspace.search.prompt"
label = "Find Text"

[[action]]
command = "navigation.recents"
label = "Recent Files"

[[action]]
command = "explorer.open"
label = "Explorer"

[[action]]
command = "session.load"
label = "Restore Session"

[[action]]
command = "session.tutor"
label = "Tutor — learn by editing"

[[action]]
command = "plugin.list"
label = "Plugins"

[[action]]
command = "recovery.inspect"
label = "Recover Unsaved Work"

[[action]]
command = "editor.quit"
label = "Quit"
arguments = { force = false }
