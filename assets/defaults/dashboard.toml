# The start screen: the DUST wordmark beside the workspace's name, branch, path and last
# commit, then boxes for recent files, changes, projects and these actions. A `logo` (a few
# lines of block letters, say) replaces the wordmark; `identity` and the version start the
# one-line header that smaller windows show instead.
logo = ""
show_identity = true
identity = "dust"
show_version = true
version_format = "v{version}"
show_path = true
resize_message = "Dust — resize terminal"
content_width = 160
minimum_width = 20
minimum_height = 7

[[action]]
command = "workspace.file.find"
label = "find file"

[[action]]
command = "workspace.search.prompt"
label = "find text"

[[action]]
command = "explorer.open"
label = "explorer"

[[action]]
command = "navigation.recents"
label = "recent files"

[[action]]
command = "session.tutor"
label = "tutor"

[[action]]
command = "session.load"
label = "restore session"

[[action]]
command = "config.open"
label = "config"

[[action]]
command = "plugin.list"
label = "plugins"

[[action]]
command = "editor.quit"
label = "quit"
arguments = { force = false }
