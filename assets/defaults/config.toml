schema_version = 1

[editor]
line_numbers = "relative"
tab_width = 4
indent_width = 4
expand_tabs = true
undo_break_on_text_commit = false
wrap = false
buffer_navigation_wrap = true
end_of_buffer_marker = "~"
half_page_percent = 50
full_page_percent = 100
line_endings = "preserve"
final_newline = "preserve"
utf8_bom = "preserve"
line_number_separator = " "
gutter_padding = 1
control_character_replacement = "�"
zero_width_replacement = "◌"
ambiguous_width = "narrow"
autopairs = true

[editor.viewport]
horizontal_margin = 4
vertical_margin = 4

[editor.git_signs]
enabled = true
unchanged = "│"
added = "│"
changed = "│"
deleted = "_"

[editor.indent_guides]
enabled = true
active_scope = true
character = "│"

[editor.large_file]
enabled = true
byte_threshold = 16777216
line_threshold = 250000
disable_syntax = true
disable_diagnostics = true
disable_wrap = true
status_label = "LARGE"

[editor.registers]
storage = "internal"
mirror_named_to_unnamed = true

# Line comment string per file extension for `gc`/`gcc`.
[editor.comments]
bash = "#"
c = "//"
cc = "//"
cpp = "//"
cs = "//"
dart = "//"
ex = "#"
exs = "#"
go = "//"
h = "//"
hpp = "//"
hs = "--"
java = "//"
js = "//"
jsx = "//"
kt = "//"
lua = "--"
mjs = "//"
nix = "#"
php = "//"
py = "#"
rb = "#"
rs = "//"
sh = "#"
sql = "--"
swift = "//"
toml = "#"
ts = "//"
tsx = "//"
vim = "\""
yaml = "#"
yml = "#"
zig = "//"
zsh = "#"

[ui]
theme = "dust"
color_mode = "auto"
mouse = true
alternate_screen = true
bracketed_paste = true
focus_events = true
keep_cursor_visible_on_resize = true

[ui.cursor]
normal = "block"
insert = "bar"
replace = "underline"
visual = "block"
operator_pending = "block"
command = "bar"
prompt = "bar"

[ui.status_line]
enabled = true
components = ["mode", "file", "diagnostics", "git", "tasks", "large_file", "lsp", "root", "position"]
scratch_label = "[scratch]"
dirty_marker = " [+]"
mode_padding = " "
component_separator = " "
position_format = "{line}:{column} "
lsp_format = "LSP {server}"
diagnostic_format = "E{errors} W{warnings}"
git_format = "Git {count} files"
task_format = "Tasks {count}"
root_format = "{root}"

[ui.status_line.mode_labels]
normal = "NORMAL"
insert = "INSERT"
replace = "REPLACE"
visual_char = "VISUAL"
visual_line = "V-LINE"
visual_block = "V-BLOCK"
operator_pending = "OPERATOR"
command_line = "COMMAND"
prompt = "PROMPT"

[ui.buffer_line]
enabled = true
show_icons = true
show_diagnostics = true
show_pins = true
show_close = true
pin_marker = "P"
close_marker = "x"
diagnostic_error_marker = "E"
diagnostic_warning_marker = "W"
scratch_icon = "S"
virtual_icon = "V"
terminal_icon = "T"
custom_icon = "C"
extension_icons = { rs = "R", md = "M", toml = "T", json = "J", ts = "T", go = "G" }
hide_when_single = true
active_format = " {title}{dirty} "
inactive_format = " {title}{dirty} "
separator = "│"
dirty_marker = " ●"
scratch_label = "[scratch]"
overflow_left = "‹ "
overflow_right = " ›"
maximum_name_width = 32

[ui.tab_line]
enabled = true
hide_when_single = true
active_format = "[{title}]"
inactive_format = " {title} "
separator = "│"
scratch_label = "[scratch]"
focus_wrap = true

[ui.panes]
default_ratio = 500
resize_step = 50
minimum_width = 8
minimum_height = 3
border = "single"
focus_wrap = true

[ui.notifications]
left = 1
rows_from_bottom = 2
max_width = 120
timeout_ms = 0

[ui.lsp_progress]
enabled = true
max_rows = 8
max_width = 72
right_margin = 1
rows_from_bottom = 1
spinner_frames = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"]
spinner_interval_ms = 80
completed_symbol = "✓"
completed_timeout_ms = 3000

[ui.key_hints]
enabled = true
delay_ms = 250
anchor = "bottom_right"
max_rows = 8
max_columns = 3
max_width = 96
horizontal_padding = 1
vertical_padding = 0
row_gap = 0
column_gap = 2
show_group_icons = true
show_command_titles = true
fallback_label = "Action"
border = "rounded"

[ui.documentation_popup]
enabled = true
max_width = 72
max_height = 18
horizontal_padding = 1
scroll_step = 4
maximum_sections = 16
maximum_lines = 512
maximum_bytes = 65536
preferred_below = true
border = "rounded"

[ui.terminal_panel]
height = 12
minimum_height = 4
maximum_height = 40
minimum_workspace_height = 3
resize_step = 2
divider = "─"
title_format = "{id}: {profile}"
tab_separator = " │ "
input_mode_label = "TERMINAL"
normal_mode_label = "NORMAL"
visual_mode_label = "VISUAL"

[ui.tool_manager]
title = "Dust tool manager"
help = "j/k select  Enter install/start  i install  p versions  x stop  R restart  u remove Dust copy  r refresh  Esc close"
installed_heading = "Installed"
available_heading = "Available"
installing_label = "installing"
installed_label = "installed"
available_label = "available"
unavailable_installer_label = "manual install required"
width_percent = 82
height_percent = 84
minimum_width = 48
minimum_height = 14
border = "single"
row_marker = "○"
selected_marker = "●"
language_separator = ", "
category_order = ["all", "lsp", "dap", "linter", "formatter"]

[ui.tool_manager.categories]
all = "All"
lsp = "LSP"
dap = "DAP"
linter = "Linter"
formatter = "Formatter"

[ui.picker]
width_percent = 88
height_percent = 82
minimum_width = 40
minimum_height = 10
border = "single"
selected_marker = ">"
row_marker = " "
# Optional prefix for the right-aligned source column.
source_separator = ""
loading_label = "loading…"
maximum_preview_bytes = 262144

[ui.explorer]
bundled_enabled = true
width = 40
minimum_width = 28
maximum_width = 60
maximum_visible_rows = 200
preview_enabled = false
maximum_preview_bytes = 262144
maximum_preview_lines = 20
focus_marker = ">"
loading_label = "loading…"
icon_mode = "nerd_font"

[ui.explorer.watch]
enabled = true
poll_interval_ms = 500
debounce_ms = 100
maximum_directories = 128
maximum_entries_per_directory = 10000
maximum_events = 128
maximum_path_bytes = 65536
queue_capacity = 8

[ui.explorer.glyphs.nerd_font]
tree_vertical = "│ "
tree_middle = "├─"
tree_last = "└─"
tree_space = "  "
directory = "󰉋"
directory_open = "󰝰"
file = "󰈔"
symlink = ""
loading = "…"
panel_vertical = "⎸"
panel_horizontal = "⎯"
icon_spacing = " "

[ui.explorer.glyphs.unicode]
tree_vertical = "│ "
tree_middle = "├─"
tree_last = "└─"
tree_space = "  "
directory = "▸"
directory_open = "▾"
file = "·"
symlink = "↗"
loading = "…"
panel_vertical = "⎸"
panel_horizontal = "⎯"
icon_spacing = " "

[ui.explorer.glyphs.ascii]
tree_vertical = "| "
tree_middle = "|-"
tree_last = "\\-"
tree_space = "  "
directory = "+"
directory_open = "-"
file = "."
symlink = "@"
loading = "~"
panel_vertical = "|"
panel_horizontal = "-"
icon_spacing = " "

[ui.command_line]
width = 60
minimum_width = 36
narrow_width_threshold = 40
outer_margin = 1
top_rows = 2
border = "single"
show_title = true
completion_max_rows = 12
input_padding = 2
attachment_gap = 0
completion_detail_gap = 2
title_min_width = 10

[ui.command_line.text]
command_title = "Command"
command_marker = ": "
search_forward_title = "Search Forward"
search_forward_marker = "/ "
search_backward_title = "Search Backward"
search_backward_marker = "? "
workspace_trust_title = "Do you want to trust this workspace?"
workspace_trust_marker = "> "
git_reset_title = "Reset this Git hunk?"
git_reset_marker = "> "
explorer_delete_title = "Delete this path?"
explorer_delete_marker = "> "
explorer_rename_title = "Rename path"
explorer_rename_marker = "> "

[startup]
show_dashboard = true

[search]
smart_case = true
regex = false
wrap = true
highlight = true

[debug]
maximum_arguments = 4096
maximum_environment = 4096
maximum_breakpoints = 10000
maximum_watches = 1000

[terminals]
queue_capacity = 256
maximum_output_bytes = 33554432
maximum_input_bytes = 1048576
scrollback_bytes = 8388608
default_profile = "shell"

[terminals.profiles.shell]
program = "/bin/sh"
arguments = []
environment = {}
columns = 80
rows = 24
float = false
close_on_exit = false

[terminals.profiles.lazygit]
program = "/bin/sh"
arguments = ["-c", "exec lazygit"]
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

# `{root}`, `{file}`, `{dir}` and `{line}` are filled from the workspace root and the current
# buffer. Paths go in as separate arguments ("$1"), never into the shell string.
[terminals.profiles.lazygit_cwd]
program = "/bin/sh"
arguments = ["-c", "exec lazygit"]
cwd = "{dir}"
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

[terminals.profiles.lazygit_file]
program = "/bin/sh"
arguments = ["-c", "exec lazygit -f \"$1\"", "lazygit", "{file}"]
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

[terminals.profiles.lazygit_log]
program = "/bin/sh"
arguments = ["-c", "exec lazygit log"]
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

[packages.registry]
base_url = "https://dust.blurskye.dev/registry/v1"
offline = false
redirect_limit = 0
connect_timeout_ms = 5000
request_timeout_ms = 30000
maximum_metadata_bytes = 1048576
maximum_artifact_bytes = 67108864
maximum_cache_bytes = 536870912
maximum_cache_entries = 4096
maximum_search_results = 100
queue_capacity = 8

[plugins]
store = "packages/store"
queue_capacity = 8
maximum_component_bytes = 67108864
maximum_commands = 256
fuel = 10000000
epoch_deadline_ticks = 10
maximum_memory_bytes = 67108864
maximum_table_elements = 10000
maximum_instances = 16

[plugins.entries]

[observability]
enabled = true
file_name = "dust.jsonl"
maximum_records = 2000
maximum_field_bytes = 4096
maximum_file_bytes = 8388608
rotations = 3
queue_capacity = 256
sensitive_keys = ["token", "password", "secret", "authorization", "source", "text"]

[processes]
event_capacity = 256
maximum_output_bytes = 16777216
maximum_line_bytes = 1048576
maximum_stdin_bytes = 16777216
maximum_timeout_ms = 300000
maximum_running = 16

[tasks]

[persistence]
enabled = true
restore_on_startup = true
save_on_exit = true
state_file = "session.json"
maximum_file_bytes = 4194304
maximum_entries = 10000
recent_files = 256
marks = 256
jumps = 1024
changes = 1024
persist_command_history = false
persist_search_history = false
queue_capacity = 4

[syntax]
enabled = true
queue_capacity = 8
debounce_ms = 75
maximum_source_bytes = 8388608
maximum_spans = 100000
maximum_folds = 10000
maximum_indent_rows = 100000

[windows]
rule = [
  { content_type = "builtin.explorer", placement = { kind = "automatic" } },
  { content_type = "builtin.terminal", placement = { kind = "automatic" } },
  { content_type = "builtin.dashboard", placement = { kind = "automatic" } },
  { content_type = "builtin.picker", placement = { kind = "automatic" } },
  { content_type = "builtin.problems", placement = { kind = "automatic" } },
  { content_type = "builtin.output", placement = { kind = "automatic" } },
  { content_type = "builtin.logs", placement = { kind = "automatic" } },
  { content_type = "builtin.debug", placement = { kind = "automatic" } },
  { content_type = "builtin.theme", placement = { kind = "automatic" } },
]

[workspace]
maximum_diagnostics = 10000
maximum_diagnostics_per_owner_uri = 2000
maximum_picker_items = 10000
picker_wrap = true
trust_state_queue_capacity = 8

[workspace.search]
regex = false
smart_case = true
whole_word = false
include_globs = []
exclude_globs = ["target/**", ".git/**"]
include_hidden = false
include_ignored = false
maximum_files = 100000
maximum_results = 10000
maximum_file_bytes = 8388608
maximum_total_bytes = 536870912
maximum_preview_bytes = 4096
batch_size = 128
event_queue_capacity = 8

[lsp]
enabled = true
auto_start = true
inlay_hints = true
inlay_hint_level = "standard"
nix_workspace_fallback = true
request_timeout_ms = 10000
restart_limit = 3
