[startup]
show_dashboard = true

[search]
smart_case = true
wrap = true
highlight = true

[debug]

[terminals]
default_profile = "shell"

[terminals.profiles.shell]
program = "/bin/sh"
arguments = []
environment = {}
columns = 80
rows = 24
float = false
close_on_exit = true

[terminals.profiles.lazygit]
program = "/bin/sh"
arguments = ["-c", "exec lazygit"]
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

# `{root}`, `{file}`, `{dir}` and `{line}` are filled from the workspace root and the current
# buffer. Paths go in as separate arguments ("$1"), never into the shell string.
[terminals.profiles.lazygit_cwd]
program = "/bin/sh"
arguments = ["-c", "exec lazygit"]
cwd = "{dir}"
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

[terminals.profiles.git_blame_line]
program = "/bin/sh"
arguments = ["-c", "git --no-pager log --color -n 3 -u -L \"$2,+1:$1\" 2>&1 | less -Rc", "git", "{file}", "{line}"]
cwd = "{dir}"
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

[terminals.profiles.lazygit_file]
program = "/bin/sh"
arguments = ["-c", "exec lazygit -f \"$1\"", "lazygit", "{file}"]
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

[terminals.profiles.lazygit_log]
program = "/bin/sh"
arguments = ["-c", "exec lazygit log"]
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

# Pull request review through `gh`, for the branch checked out in this worktree.
[terminals.profiles.gh_pr_view]
program = "/bin/sh"
arguments = ["-c", "GH_PAGER='less -Rc' gh pr view --comments"]
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

[terminals.profiles.gh_pr_diff]
program = "/bin/sh"
arguments = ["-c", "gh pr diff --color=always | less -Rc"]
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

[terminals.profiles.gh_pr_review]
program = "/bin/sh"
arguments = ["-c", "gh pr review || { echo; echo 'Press Enter to close'; read _; }"]
environment = {}
columns = 80
rows = 24
float = true
close_on_exit = true

# ACP agents for `<leader>a`. Each session runs in the worktree that was open when it
# started. Every agent that supports MCP gets Dust's `agent` tool for subagents, which run
# as tabs of their own. The Claude, Codex and pi adapters can be installed from the tool manager
# (`<leader>cm`, Agent); OpenCode and Gemini speak ACP themselves. `options` picks a model,
# mode or thinking level at start, e.g. `options = { model = "…", thought_level = "high" }`.
[agents]
default = "claude"
# "acp" talks to the agent in Dust's agent panel; "terminal" runs its own program (`cli`) in a
# terminal beside the editor, where the panel opens, and it handles its own login, permissions
# and history there.
connection = "acp"
# Share of the editor width the agent panel opens at; drag its border or use ctrl-left and
# ctrl-right in it to change it.
panel_width = 35
# "left" or "right": the side the agent panel or terminal agent opens on.
side = "right"
# Agents such as pi read MCP servers only from their own config, so Dust gives them its tools,
# such as subagents, by running the profile's `add_tools` command before they start. It
# changes that agent's config; with false each new session says what to run instead.
add_tools = true

[agents.profiles.claude]
program = "claude-agent-acp"
cli = ["claude"]
arguments = []
environment = {}
options = {}
# Over ACP, subagents come from Dust's `agent` tool, so Claude Code's own subagent tools are
# off there (Task in older versions, Agent and Workflow in newer ones); the `claude` CLI in a
# terminal keeps them.
meta = { claudeCode = { options = { disallowedTools = ["Task", "Agent", "Workflow"] } } }

[agents.profiles.codex]
program = "codex-acp"
cli = ["codex"]
arguments = []
environment = {}
# Over ACP, subagents come from Dust's `agent` tool, so Codex's own multi-agent tools are off
# there; the `codex` CLI in a terminal keeps them.
acp_environment = { CODEX_CONFIG = '{"features":{"multi_agent":false}}' }
options = {}

[agents.profiles.pi]
program = "pi-acp"
cli = ["pi"]
arguments = []
# pi draws its own cursor unless told to show the terminal's, which kitty's cursor trail and
# screen readers follow.
environment = { PI_HARDWARE_CURSOR = "1" }
options = {}
# pi reads MCP servers only from its own config; `mcp add` replaces an entry of the same name.
add_tools = ["pi", "mcp", "add", "dust", "--exposure", "direct", "--", "{dust}", "--agent-tools"]

[agents.profiles.opencode]
program = "opencode"
cli = ["opencode"]
arguments = ["acp"]
environment = {}
# Over ACP, subagents come from Dust's `agent` tool, so OpenCode's own task tool is off there;
# `opencode` in a terminal keeps it.
acp_environment = { OPENCODE_CONFIG_CONTENT = '{"tools":{"task":false}}' }
options = {}

[agents.profiles.gemini]
program = "gemini"
cli = ["gemini"]
arguments = ["--experimental-acp"]
environment = {}
options = {}

