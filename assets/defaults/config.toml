schema_version = 1

[editor]
line_numbers = "relative"
tab_width = 4
indent_width = 4
expand_tabs = true
wrap = false
line_endings = "preserve"
final_newline = "preserve"
ambiguous_width = "narrow"
autopairs = true

[editor.viewport]
horizontal_margin = 4
vertical_margin = 4

[editor.git_signs]
enabled = true

[editor.indent_guides]
enabled = true

# Markdown drawn in place, as render-markdown.nvim does: heading bars, bullets, checkboxes,
# quotes, rules, code blocks and links without their markup. The cursor's line, and every
# line outside Normal mode, shows its source.
[editor.markdown]
render = true
# Close a table with a border under its last row, and draw one between its rows.
table_bottom = true
table_row_lines = false

[editor.markdown.glyphs]
headings = ["󰲡 ", "󰲣 ", "󰲥 ", "󰲧 ", "󰲩 ", "󰲫 "]
bullets = ["●", "○", "◆", "◇"]
unchecked = "󰄱"
checked = "󰱒"
quote = "▋"
link = "󰌹 "
image = "󰥶 "
rule = "─"
# A table's top, the row under its header, its bottom, then the line between cells and across.
table = ["┌", "┬", "┐", "├", "┼", "┤", "└", "┴", "┘", "│", "─"]
table_alignment = "━"

# A link's icon by what its address contains; the longest match wins, `link` otherwise.
[editor.markdown.glyphs.links]
"http" = "󰖟 "
"github.com" = "󰊤 "
"gitlab.com" = "󰮠 "
"google.com" = "󰊭 "
"neovim.io" = " "
"reddit.com" = "󰑍 "
"stackoverflow.com" = "󰓌 "
"wikipedia.org" = "󰖬 "
"youtube.com" = "󰗃 "
"youtu.be" = "󰗃 "
"discord.com" = "󰙯 "
"mailto:" = "󰀓 "

# Callouts as GitHub writes them, `> [!NOTE]`, with the group that colours them.
[editor.markdown.glyphs.callouts]
note = { text = "󰋽 Note", group = "DiagnosticInfo" }
tip = { text = "󰌶 Tip", group = "DiagnosticOk" }
important = { text = "󰅾 Important", group = "DiagnosticHint" }
warning = { text = "󰀪 Warning", group = "DiagnosticWarn" }
caution = { text = "󰳦 Caution", group = "DiagnosticError" }
abstract = { text = "󰨸 Abstract", group = "DiagnosticInfo" }
info = { text = "󰋽 Info", group = "DiagnosticInfo" }
todo = { text = "󰗡 Todo", group = "DiagnosticInfo" }
success = { text = "󰄬 Success", group = "DiagnosticOk" }
question = { text = "󰘥 Question", group = "DiagnosticWarn" }
failure = { text = "󰅖 Failure", group = "DiagnosticError" }
danger = { text = "󱐌 Danger", group = "DiagnosticError" }
bug = { text = "󰨰 Bug", group = "DiagnosticError" }
example = { text = "󰉹 Example", group = "DiagnosticHint" }
quote = { text = "󱆨 Quote", group = "@markup.quote" }

[editor.large_file]
enabled = true

[editor.registers]
# "unnamedplus" shares yanks and pastes with the system clipboard; "off" keeps them internal.
clipboard = "unnamedplus"

# Line comment string per file extension for `gc`/`gcc`; `%s` marks where the line goes.
[editor.comments]
bash = "#"
c = "//"
cc = "//"
cpp = "//"
cs = "//"
css = "/* %s */"
dart = "//"
ex = "#"
exs = "#"
go = "//"
h = "//"
hpp = "//"
hs = "--"
html = "<!-- %s -->"
java = "//"
js = "//"
jsx = "//"
kt = "//"
lua = "--"
md = "<!-- %s -->"
markdown = "<!-- %s -->"
mjs = "//"
nix = "#"
php = "//"
py = "#"
rb = "#"
rs = "//"
sh = "#"
sql = "--"
swift = "//"
toml = "#"
ts = "//"
tsx = "//"
vim = "\""
xml = "<!-- %s -->"
yaml = "#"
yml = "#"
zig = "//"
zsh = "#"

[ui]
theme = "dust"
color_mode = "auto"
mouse = true

[ui.cursor]
normal = "block"
insert = "bar"

[ui.status_line]
enabled = true
components = ["mode", "git", "file", "breadcrumbs", "diagnostics", "tasks", "large_file", "lsp", "root", "progress", "position"]

[ui.status_line.mode_labels]
normal = "NORMAL"
insert = "INSERT"
replace = "REPLACE"
visual_char = "VISUAL"
visual_line = "V-LINE"
visual_block = "V-BLOCK"
multi = "MULTI"
operator_pending = "OPERATOR"
command_line = "COMMAND"
prompt = "PROMPT"
terminal = "TERMINAL"

[ui.buffer_line]
enabled = true
# Per-extension overrides; otherwise the explorer's file icons are used.
extension_icons = {}
hide_when_single = false

[ui.lsp_progress]
enabled = true

[ui.key_hints]
enabled = true
