# The command palette (F1, <leader>:): rows read "Category: Label" with the key on the right.
[command_palette]
# Plumbing that only keys use. Commands that need typed text are listed only under prompts below.
hidden = [
    "lsp.rename.prompt",
  "input.", "command_line.", "picker.", "surface.", "mode.", "completion.",
  "edit.", "view.cursor.", "view.selection.", "view.scroll", "explorer.search.",
  "multi.move", "multi.delete_char", "multi.next", "multi.previous", "multi.skip", "multi.remove",
  "agent.input.", "agent.escape", "tools.category.", "tools.menu.next", "tools.menu.previous",
  "tools.menu.close", "terminal.mode.", "terminal.send", "macro.", "workspace.edit.",
  "search.word", "search.repeat", "settings.page.", "settings.setup.",
  # These act on the tool manager's selected row, so they only work inside it.
  "tools.search", "tools.activate", "tools.install", "tools.uninstall", "tools.lsp.",
  "tools.runtime.",
]

