chapter = "Projects"
text = "`<leader>` `f` `p` lists project folders you can switch to, and `:recovery` brings back unsaved work after a crash."
press = "Press `<leader>` `f` `p` to list project folders, then `esc` `esc` to close it."
done = ["workspace.root.list"]
keys = "<leader>fp<escape><escape>"

[[step]]
chapter = "Projects"
text = "A session keeps the open files, windows and tab pages of a project. `:sessionsave` saves it."
press = "Type `:wa` and press `enter` to save your files, then type `:sessionsave` and press `enter`."
done = ["session.save"]
keys = ":wa<enter><wait>:sessionsave<enter><wait>"

[[step]]
chapter = "Projects"
text = "`<leader>` `q` `s` (or `:sessionload`) brings the saved session back."
press = "Press `<leader>` `q` `s`."
done = ["session.load"]
resume_from_previous = true
keys = "<leader>qs<wait>"

[[step]]
chapter = "Look and feel"
text = "Themes change with a live preview."
press = "Press `<leader>` `u` `C` (capital C) to pick a theme, then `enter` keeps one or `esc` `esc` goes back."
done = ["theme.select"]
keys = "<leader>uC<wait><escape><escape>"

[[step]]
chapter = "Look and feel"
text = "`<leader>` `u` `l` toggles line numbers, `<leader>` `u` `L` relative numbers, `<leader>` `u` `g` indent guides and `<leader>` `u` `z` zen mode."
press = "Press `<leader>` `u` `w` to wrap long lines."
done = ["view.wrap.toggle", "view.line_numbers.toggle", "view.zen.toggle"]
keys = "<leader>uw"

[[step]]
chapter = "Help"
text = "Help knows where you are and shows what you can do there."
press = "Press `<leader>` then `?`, then `esc` `esc` to close it."
done = ["overlay.help.contextual"]
keys = "<leader>?<escape><escape>"

[[step]]
chapter = "Help"
text = "The command palette lists every command with its key: type to filter and `enter` runs one."
press = "Press `F1` to open it, then `esc` `esc` to close it."
done = ["command_palette.open"]
keys = "<f1><escape><escape>"

[[step]]
chapter = "Help"
text = "In the palette `ctrl-o` explains the command under the cursor: what it does, its keys and what it takes."
press = "Press `F1`, then `ctrl-o` to read about the first command, then `esc` until it is closed."
done = ["overlay.help.reference"]
keys = "<f1><ctrl-o><escape><escape><escape><escape>"

[[step]]
chapter = "Help"
text = "Every message Dusty showed is kept: `<leader>` `n` lists them, newest first."
press = "Press `<leader>` `n`, then `esc` `esc` to close the list."
done = ["application.notifications.open"]
keys = "<leader>n<escape><escape>"

[[step]]
chapter = "Plugins"
text = "`:pluginvalidate` checks a plugin and `:plugindisable` turns one off."
press = "Type `:plugins` and press `enter`, then `esc` `esc` to close the list."
done = ["plugin.list"]
keys = ":plugins<enter><escape><escape>"

[[step]]
chapter = "Saving"
text = "`:w` saves, `:q` quits Dusty and `:wq` saves and quits. `ctrl-s` saves too."
press = "Type `:w` and press `enter` to save {practice}."
done = ["file.save"]
open = "{practice}"
keys = ":w<enter>"

[[step]]
chapter = "Done"
text = "That's the tour! Your settings go in ~/.config/dusty/config.toml and your keys in keymaps.toml, only what you change. `:Tutor` starts this again any time, and `:TutorChapters` jumps to one chapter."
press = "Type `:TutorNext` and press `enter` to finish."
keys = ":TutorNext<enter>"
