# The interactive tutor's lessons. `:Tutor` asks for a language (Rust, TypeScript or Python),
# makes a small practice project in it (assets/defaults/tutor/<language>/, made into a
# repository with one changed file) and shows one step at a time on a card above the status
# line, moving on once the step is done. The editing practice lines are the same in every
# language (assets/defaults/tutor/practice.txt, inside a comment of the practice file).
#
# Each step has `text`, what the step is about, and `press`, the one thing to do now. In
# both, `<leader>` shows as the user's leader key, and {language}, {server}, {practice},
# {main} and {greet} as the chosen language, its language server and its practice files.
#
# A step can set the scene when it starts:
#   open     - show this file of the practice project (the practice file when only `at` or
#              `mark` is given)
#   at       - put the cursor at the start of the first line holding this text
#   mark     - highlight this text, the first one from the `at` line on
#   split    - true: at least two windows; false: one window, not zoomed
#   explorer - show (true) or hide (false) the file explorer
#   terminal - show (true) or hide (false) the terminal panel
#   resume_from_previous - replay the preceding lesson first when resuming a fresh project
#
# A step is done when, in Normal mode:
#   line      - a line of the step's file holds this text
#   gone      - no line of the step's file holds this text
#   twice     - at least two lines hold this text
#   indented  - the line holding this text is indented further than it was
#   commented - the line holding this text is commented out
#   cursor    - the text under the cursor starts with this
#   done      - otherwise, when one of these commands runs ("id key=value ...")
# A command counts once it ran without an error. A step with none of these waits for
# :TutorNext.

