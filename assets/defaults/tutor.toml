# The interactive tutor's lessons. `:Tutor` asks for a language (Rust, TypeScript or Python),
# makes a small practice project in it (assets/defaults/tutor/<language>/, made into a
# repository with one changed file) and shows one step at a time on a card above the status
# line, moving on once the step is done. The editing practice lines are the same in every
# language (assets/defaults/tutor/practice.txt, inside a comment of the practice file).
# Everything happens in that throwaway project: `:TutorQuit` or the last step deletes it.
#
# Steps with the same `chapter` in a row make a chapter: `:TutorChapters` lists them with what
# is done and goes to one, `:TutorNext` skips a step and `:TutorBack` goes back one.
#
# Each step has `text`, what the step is about, and `press`, the one thing to do now. In
# both, `<leader>` shows as the user's leader key, and {language}, {server}, {practice},
# {main} and {greet} as the chosen language, its language server and its practice files.
# `keys` are the keys that do the step, which the tests press: characters stand for
# themselves, `<name>` is a named key (`<escape>`, `<enter>`, `<ctrl-o>`, `<leader>`, `<lt>`
# for `<`) and `<wait>` lets the work the keys started finish first.
#
# A step can set the scene when it starts:
#   open     - show this file of the practice project (the practice file when only `at` or
#              `mark` is given)
#   at       - put the cursor at the start of the first line holding this text
#   mark     - highlight this text, the first one from the `at` line on
#   split    - true: at least two windows; false: one window, not zoomed
#   explorer - show (true) or hide (false) the file explorer
#   terminal - show (true) or hide (false) the terminal panel
#   setup    - "conflict": stop a merge on a conflict in notes.txt; "tasks": add the practice
#              tasks (status, todo and tests, run with {runner}) while the tutor runs
#   resume_from_previous - replay the preceding lesson first when resuming a fresh project
#
# A step that can't work on this machine names what it needs, and until that is there the
# card says why and `:TutorNext` skips it:
#   needs    - "server" (the language server), "debugger" (a debug adapter for the language),
#              "agent" (a coding agent program) or programs on PATH, such as "{runner}" or
#              "git less"
#
# A step is done when, in Normal mode:
#   line      - a line of the step's file holds this text
#   gone      - no line of the step's file holds this text
#   twice     - at least two lines hold this text
#   indented  - the line holding this text is indented further than it was
#   commented - the line holding this text is commented out
#   cursor    - the text under the cursor starts with this
#   staged    - this file of the project has changes staged for the next commit
#   clean     - this file of the project is the same as in the last commit
#   done      - otherwise, when one of these commands runs ("id key=value ...")
# A command counts once it ran without an error. A step with none of these waits for
# :TutorNext.

[[step]]
chapter = "Welcome"
text = "Hi! I'm the tutor. I show you one thing at a time, and the next step comes as soon as you've done it. You practice in {practice}, in a small {language} project that is thrown away afterwards, so nothing you do here can hurt your own work. `:TutorChapters` lists the chapters."
press = "Press `j` to move the cursor down one line."
done = ["input.motion motion=down"]
open = "{practice}"
split = false
explorer = false
terminal = false
keys = "j"

[[step]]
chapter = "Moving around"
text = "In Normal mode `h` `j` `k` `l` move left, down, up and right."
press = "Use `j` and `l` to put the cursor on the marked X."
at = "h  left      j  down      k  up      l  right"
mark = "X marks"
cursor = "X marks"
keys = "jjllll"

