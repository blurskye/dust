[highlights]
# Dust's own colours, in Neovim's highlight groups.
"Comment" = { fg = "#8b949e", italic = true }
"Constant" = { fg = "#79c0ff" }
"String" = { fg = "#a5d6ff" }
"Character" = { link = "String" }
"Identifier" = { fg = "#c9d1d9" }
"Function" = { fg = "#d2a8ff" }
"Statement" = { fg = "#ff7b72", bold = true }
"Operator" = { fg = "#ff7b72" }
"PreProc" = { fg = "#ff7b72", bold = true }
"Type" = { fg = "#ffa657" }
"Special" = { fg = "#79c0ff" }
"Delimiter" = { fg = "#8b949e" }
"Title" = { fg = "#58a6ff", bold = true }
"Underlined" = { fg = "#ffa657", underline = true }
"Todo" = { fg = "#0d1117", bg = "#d29922", bold = true }
"Added" = { fg = "#3fb950" }
"Changed" = { fg = "#d29922" }
"Removed" = { fg = "#f85149" }
"DiagnosticError" = { fg = "#f85149" }
"DiagnosticWarn" = { fg = "#d29922" }
"DiagnosticInfo" = { fg = "#58a6ff" }
"DiagnosticHint" = { fg = "#8b949e" }
"@variable" = { fg = "#c9d1d9" }
"@property" = { fg = "#79c0ff" }
"@variable.member" = { link = "@property" }
"@attribute" = { fg = "#7ee787" }
"@constructor" = { link = "Type" }
"@module" = { link = "Type" }
"@markup.raw" = { link = "String" }
"@markup.quote" = { fg = "#8b949e", italic = true }
