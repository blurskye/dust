# Dust-owned Linux tool sources. Direct release artifacts are exact-version, HTTPS-only
# and SHA-256 pinned. Ecosystem packages are exact-version and installed only in a
# Dust-owned Bun prefix. The package installer never invokes npm or a system package
# manager. On NixOS, explicit LSP installation realizes Dust's locked private Nix
# compatibility environment, then verifies and processes this same upstream artifact.

[[tool]]
id = "rust-analyzer"
name = "rust-analyzer"
kind = "lsp"
languages = ["rust"]
executable = "rust-analyzer"
version = "0.3.3025"
release = "2026-08-24"
probe_args = ["--version"]
project_root_markers = ["Cargo.toml"]
project_root_strategy = "cargo"

[tool.install]
method = "archive"
url = "https://github.com/rust-lang/rust-analyzer/releases/download/2026-08-24/rust-analyzer-x86_64-unknown-linux-gnu.gz"
sha256 = "c4d409690b98d84ce98174829362a59214825d72304fe2504f4b906a116b51fe"
archive = "gzip"
executable_path = "rust-analyzer"

# Exact recent release pins shown as separate choices in :lsp. Mutable aliases such
# as `nightly` are deliberately excluded; every row has an immutable URL and digest.
[[tool.pins]]
version = "0.3.3016"
release = "2026-08-17.4"

[tool.pins.install]
method = "archive"
url = "https://github.com/rust-lang/rust-analyzer/releases/download/2026-08-17.4/rust-analyzer-x86_64-unknown-linux-gnu.gz"
sha256 = "a559eaa29920e4c12718fba101f2055f1da0ad8bc458ef9dc1a670778cc66901"
archive = "gzip"
executable_path = "rust-analyzer"

[[tool.pins]]
version = "0.3.3008"
release = "2026-08-10.1"

[tool.pins.install]
method = "archive"
url = "https://github.com/rust-lang/rust-analyzer/releases/download/2026-08-10.1/rust-analyzer-x86_64-unknown-linux-gnu.gz"
sha256 = "d42908a7dc7b89250ae881a0919e477296843665c98574ecc8fe16ba60cecefb"
archive = "gzip"
executable_path = "rust-analyzer"

[[tool.pins]]
