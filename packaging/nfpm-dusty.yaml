# deb, rpm and pacman packages of the static editor binary, built by
# packaging/build-packages.sh. Dusty Git is its own package (nfpm-dusty-git.yaml).
name: dusty
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: editors
priority: optional
maintainer: blurskye <blurskye@proton.me>
description: Terminal IDE with Vim keys, language servers, debugging, git and coding agents.
vendor: blurskye
homepage: https://github.com/dustyhq/dusty
license: GPL-3.0-or-later
recommends:
  - git
contents:
  - src: target/package-stage/dusty/dusty
    dst: /usr/bin/dusty
    file_info: { mode: 0755 }
  - src: packaging/dev.dustyhq.Dusty.desktop
    dst: /usr/share/applications/dev.dustyhq.Dusty.desktop
  - src: packaging/dev.dustyhq.Dusty.svg
    dst: /usr/share/icons/hicolor/scalable/apps/dev.dustyhq.Dusty.svg
  - src: packaging/dev.dustyhq.Dusty.metainfo.xml
    dst: /usr/share/metainfo/dev.dustyhq.Dusty.metainfo.xml
  - src: LICENSE
    dst: /usr/share/licenses/dusty/LICENSE
  - src: NOTICE
    dst: /usr/share/licenses/dusty/NOTICE
  - src: LICENSES/
    dst: /usr/share/licenses/dusty/LICENSES
    type: tree
