name: release
# Pushing a tag vX.Y.Z publishes Linux packages and unsigned macOS and Windows archives.
# Running this workflow by hand builds artifacts without publishing them.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version from Cargo.toml, which a tag must match
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ $GITHUB_REF == refs/tags/* && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.97.0
        with: { targets: x86_64-unknown-linux-musl }
      - name: Install musl and packaging tools
        env: { GH_TOKEN: '${{ github.token }}' }
        # musl-gcc needs the kernel headers to build OpenSSL.
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          for dir in asm asm-generic linux; do
            source=/usr/include/$dir; [ $dir = asm ] && source=/usr/include/x86_64-linux-gnu/asm
            sudo ln -sfn "$source" /usr/include/x86_64-linux-musl/$dir
          done
          mkdir -p "$HOME/.local/bin"
          gh release download v2.48.0 --repo goreleaser/nfpm \
            --pattern 'nfpm_2.48.0_Linux_x86_64.tar.gz' --output - | tar -xz -C "$HOME/.local/bin" nfpm
          gh release download continuous --repo AppImage/appimagetool \
            --pattern appimagetool-x86_64.AppImage --output "$HOME/.local/bin/appimagetool"
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the static binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl --features static
      - name: Check both binaries run and link nothing
        run: |
          for binary in target/x86_64-unknown-linux-musl/release/{dusty,dusty-git}; do
            if ldd "$binary" 2>/dev/null | grep -q '=>'; then ldd "$binary"; exit 1; fi
            "$binary" --version
          done
      - run: packaging/build-packages.sh ${{ steps.version.outputs.version }} target/x86_64-unknown-linux-musl/release/dusty
      - uses: actions/upload-artifact@v4
        with: { name: dist-packages, path: dist/*, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with:
          name: stage
          path: |
            target/package-stage/dusty/dusty
            target/package-stage/dusty/dusty-git
          if-no-files-found: error

  flatpak:
    needs: packages
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: stage, path: target/package-stage/dusty }
      - run: chmod +x target/package-stage/dusty/dusty target/package-stage/dusty/dusty-git
      # The image already has the 26.08 Platform and Sdk. Building against them, without
      # --install-deps-from, skips updating the Sdk from Flathub, which fails inside this
      # container's overlay filesystem ("Invalid cross-device link") whenever Flathub has
      # a newer Sdk build than the image.
      - name: Build the Flatpak bundle
        env: { VERSION: '${{ needs.packages.outputs.version }}' }
        run: |
          flatpak info org.freedesktop.Sdk//26.08
          flatpak-builder --repo=repo --disable-rofiles-fuse --force-clean \
            --default-branch=master build packaging/flatpak/dev.dustyhq.Dusty.yml
          flatpak build-bundle repo "dusty-$VERSION-x86_64.flatpak" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo dev.dustyhq.Dusty master
      - uses: actions/upload-artifact@v4
        with: { name: dist-flatpak, path: '*.flatpak', if-no-files-found: error }

  ports:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: aarch64-macos
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: x86_64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: x86_64-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with: { targets: '${{ matrix.target }}' }
      - name: Build the native binary
        run: cargo build --release --locked --target '${{ matrix.target }}' --features static
      - name: Package the unsigned binary
        env:
          VERSION: ${{ needs.packages.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p dist stage
          cp LICENSE NOTICE stage/
          cp -R LICENSES stage/
          exe=; [[ $RUNNER_OS == Windows ]] && exe=.exe
          for name in dusty dusty-git; do
            binary="target/$TARGET/release/$name$exe"
            "$binary" --version
            cp "$binary" stage/
          done
          if [[ $RUNNER_OS == Windows ]]; then
            (cd stage && 7z a -tzip "../dist/dusty-$VERSION-$ARCHIVE.zip" .)
          else
            tar -czf "dist/dusty-$VERSION-$ARCHIVE.tar.gz" -C stage .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.archive }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages, flatpak, ports]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: dist-*, merge-multiple: true, path: dist }
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Keyless signature of the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Create the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Dusty ${{ needs.packages.outputs.version }}" --generate-notes
