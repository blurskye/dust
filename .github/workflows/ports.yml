name: ports
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with: { components: clippy }
      - name: Use the physical temporary directory on macOS
        if: runner.os == 'macOS'
        run: echo "TMPDIR=$(cd "$TMPDIR" && pwd -P)" >> "$GITHUB_ENV"
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
