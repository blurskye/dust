[package]
name = "dusty"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A terminal IDE with Vim keys, language servers, debugging, git and coding agents"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
default-run = "dusty"

[workspace]
members = ["crates/*"]
# Plain cargo commands at the root cover every crate.
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/dustyhq/dusty"
homepage = "https://github.com/dustyhq/dusty"
rust-version = "1.89"

[workspace.dependencies]
dusty-core = { path = "crates/dusty-core", version = "0.3.2" }
dusty-forge = { path = "crates/dusty-forge", version = "0.3.2" }
dusty-ui = { path = "crates/dusty-ui", version = "0.3.2" }
dusty-git = { path = "crates/dusty-git", version = "0.3.2" }
# The terminal emulator behind Alacritty and Zed, so programs in Dusty's terminals behave as in a
# real one; Dusty keeps its own PTY processes and only feeds it their output.
alacritty_terminal = { version = "0.26.0", default-features = false }
clap = { version = "4.5.28", features = ["derive"] }
# Keep unread SIGWINCH readiness pending when input and resize arrive together.
# Crossterm 0.29's default Mio backend can discard the second edge-triggered event.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
fancy-regex = "0.20.0"
flate2 = "1.1.5"
globset = "0.4.16"
# HTTPS and SSH transports support Git remote operations.
git2 = { version = "0.20.2", default-features = false, features = ["https", "ssh"] }
ignore = "=0.4.28"
portable-pty = "0.9.0"
regex = "1.11.1"
reqwest = { version = "=0.12.15", default-features = false, features = ["blocking", "rustls-tls", "http2", "gzip"] }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
slotmap = "1.0.7"
tempfile = "3.15.0"
tar = "0.4.44"
thiserror = "2.0.11"
tree-sitter = "0.25.10"
tree-sitter-rust = "=0.24.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-md-025 = { version = "=0.5.6", default-features = false }
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-css = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-python = "=0.25.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-lua = "=0.5.0"
tree-sitter-nix = "=0.3.0"
tree-sitter-java = "=0.23.5"
tree-sitter-ruby = "=0.23.1"
tree-sitter-php = "=0.24.2"
tree-sitter-zig = "=1.1.2"
tree-sitter-haskell = "=0.23.1"
tree-sitter-elixir = "=0.3.5"
tree-sitter-ocaml = "=0.24.2"
tree-sitter-scala = "=0.26.2"
tree-sitter-swift = "=0.7.3"
tree-sitter-kotlin-sg = "=0.4.1"
tree-sitter-dart = "=0.2.0"
tree-sitter-make = "=1.1.1"
tree-sitter-cmake = "=0.7.5"
tree-sitter-xml = "=0.7.0"
tree-sitter-diff = "=0.1.0"
tree-sitter-ini = "=1.4.0"
tree-sitter-proto = "=0.4.0"
tree-sitter-sequel = "=0.3.11"
tree-sitter-erlang = "=0.16.0"
tree-sitter-r = "=1.3.0"
tree-sitter-julia = "=0.23.1"
tree-sitter-vue-next = "=0.1.0"
wasmtime = { version = "31.0.0", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }
toml = "0.9.8"
toml_edit = "0.25.12"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
zstd = "=0.13.3"
nix = { version = "0.30.1", features = ["signal", "process", "fs", "poll", "event"] }
# Atomic exchange and no-clobber renames on Linux (including musl) and macOS.
rustix = { version = "1.1.4", features = ["fs", "process"] }
# Native AF_UNIX sockets (Windows 10 and later) for the remote socket, with std's API.
uds_windows = "1.2.1"
# Safe file identity (volume serial and file index); already used by same-file.
winapi-util = "0.1.11"

[dependencies]
dusty-core.workspace = true
dusty-forge.workspace = true
dusty-ui.workspace = true
dusty-git.workspace = true
alacritty_terminal.workspace = true
clap.workspace = true
crossterm.workspace = true
fancy-regex.workspace = true
flate2.workspace = true
globset.workspace = true
git2.workspace = true
ignore.workspace = true
portable-pty.workspace = true
regex.workspace = true
reqwest.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
slotmap.workspace = true
tempfile.workspace = true
tar.workspace = true
thiserror.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-go.workspace = true
tree-sitter-json.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-md-025.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-css.workspace = true
tree-sitter-html.workspace = true
tree-sitter-python.workspace = true
tree-sitter-yaml.workspace = true
tree-sitter-lua.workspace = true
tree-sitter-nix.workspace = true
tree-sitter-java.workspace = true
tree-sitter-ruby.workspace = true
tree-sitter-php.workspace = true
tree-sitter-zig.workspace = true
tree-sitter-haskell.workspace = true
tree-sitter-elixir.workspace = true
tree-sitter-ocaml.workspace = true
tree-sitter-scala.workspace = true
tree-sitter-swift.workspace = true
tree-sitter-kotlin-sg.workspace = true
tree-sitter-dart.workspace = true
tree-sitter-make.workspace = true
tree-sitter-cmake.workspace = true
tree-sitter-xml.workspace = true
tree-sitter-diff.workspace = true
tree-sitter-ini.workspace = true
tree-sitter-proto.workspace = true
tree-sitter-sequel.workspace = true
tree-sitter-erlang.workspace = true
tree-sitter-r.workspace = true
tree-sitter-julia.workspace = true
tree-sitter-vue-next.workspace = true
wasmtime.workspace = true
toml.workspace = true
toml_edit.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
zip.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
uds_windows.workspace = true
winapi-util.workspace = true

[features]
# Builds OpenSSL and libgit2 into the binary, for the static release build.
static = ["git2/vendored-openssl", "git2/vendored-libgit2"]

[dev-dependencies]
dusty-core = { workspace = true, features = ["test-support"] }
dusty-forge = { workspace = true, features = ["test-support"] }
dusty-ui = { workspace = true, features = ["test-support"] }
dusty-git = { workspace = true, features = ["test-support"] }
wit-component = "=0.226.0"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Debug builds and tests compile plugins with Cranelift, which is many times slower unoptimized.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
