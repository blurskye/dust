[package]
name = "dust"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"
default-run = "dust"

[dependencies]
clap = { version = "4.5.28", features = ["derive"] }
crossterm = "0.29.0"
globset = "0.4.16"
ignore = "0.4.23"
nix = { version = "0.30.1", features = ["signal", "process"] }
portable-pty = "0.9.0"
regex = "1.11.1"
reqwest = { version = "=0.12.15", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
ropey = "1.6.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
slotmap = "1.0.7"
tempfile = "3.15.0"
thiserror = "2.0.11"
tree-sitter = "0.25.10"
tree-sitter-rust = "=0.24.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-md-025 = { version = "=0.5.6", default-features = false }
wasmtime = { version = "31.0.0", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }
toml = "0.9.8"
toml_edit = "0.25.12"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
zstd = "=0.13.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
