[package]
name = "dust"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A terminal IDE with Vim keys, language servers, debugging, git and coding agents"
repository = "https://github.com/blurskye/dust"
homepage = "https://github.com/blurskye/dust"
rust-version = "1.89"
default-run = "dust"

[dependencies]
# The terminal emulator behind Alacritty and Zed, so programs in Dust's terminals behave as in a
# real one; Dust keeps its own PTY processes and only feeds it their output.
alacritty_terminal = { version = "0.26.0", default-features = false }
clap = { version = "4.5.28", features = ["derive"] }
# Keep unread SIGWINCH readiness pending when input and resize arrive together.
# Crossterm 0.29's default Mio backend can discard the second edge-triggered event.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
fancy-regex = "0.20.0"
flate2 = "1.1.5"
globset = "0.4.16"
# HTTPS and SSH transports support Git remote operations.
git2 = { version = "0.20.2", default-features = false, features = ["https", "ssh"] }
ignore = "=0.4.28"
portable-pty = "0.9.0"
regex = "1.11.1"
reqwest = { version = "=0.12.15", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
slotmap = "1.0.7"
tempfile = "3.15.0"
tar = "0.4.44"
thiserror = "2.0.11"
tree-sitter = "0.25.10"
tree-sitter-rust = "=0.24.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-md-025 = { version = "=0.5.6", default-features = false }
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-css = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-python = "=0.25.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-lua = "=0.5.0"
tree-sitter-nix = "=0.3.0"
tree-sitter-java = "=0.23.5"
tree-sitter-ruby = "=0.23.1"
tree-sitter-php = "=0.24.2"
tree-sitter-zig = "=1.1.2"
tree-sitter-haskell = "=0.23.1"
tree-sitter-elixir = "=0.3.5"
tree-sitter-ocaml = "=0.24.2"
tree-sitter-scala = "=0.26.2"
tree-sitter-swift = "=0.7.3"
tree-sitter-kotlin-sg = "=0.4.1"
tree-sitter-dart = "=0.2.0"
tree-sitter-make = "=1.1.1"
tree-sitter-cmake = "=0.7.5"
tree-sitter-xml = "=0.7.0"
tree-sitter-diff = "=0.1.0"
tree-sitter-ini = "=1.4.0"
tree-sitter-proto = "=0.4.0"
tree-sitter-sequel = "=0.3.11"
tree-sitter-erlang = "=0.16.0"
tree-sitter-r = "=1.3.0"
tree-sitter-julia = "=0.23.1"
tree-sitter-vue-next = "=0.1.0"
wasmtime = { version = "31.0.0", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }
toml = "0.9.8"
toml_edit = "0.25.12"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
zstd = "=0.13.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["signal", "process", "fs", "poll", "event"] }
# Atomic exchange and no-clobber renames on Linux (including musl) and macOS.
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
# Native AF_UNIX sockets (Windows 10 and later) for the remote socket, with std's API.
uds_windows = "1.2.1"
# Safe file identity (volume serial and file index); already used by same-file.
winapi-util = "0.1.11"

[features]
# Builds OpenSSL and libgit2 into the binary, for the static release build.
static = ["git2/vendored-openssl", "git2/vendored-libgit2"]

[dev-dependencies]
wit-component = "=0.226.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# Debug builds and tests compile plugins with Cranelift, which is many times slower unoptimized.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
