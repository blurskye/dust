[profile.ci]
# Report every failure instead of stopping at the first one.
fail-fast = false
# A test still running after three minutes is reported as hung and stopped.
slow-timeout = { period = "60s", terminate-after = 3 }
# Hosted runners have few cores and many tests spawn processes.
test-threads = 4

# The tutor tests walk every lesson against real Git; Windows starts processes several
# times slower than Linux or macOS.
[[profile.ci.overrides]]
filter = 'test(/tutor/) | binary(/tutor/)'
slow-timeout = { period = "60s", terminate-after = 10 }
