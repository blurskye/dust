[plugin.contributions]
schema_version = 1

[[plugin.contributions.content_types]]
id = "plugin.demo.panel"
title = "Target retained"
presenter = "retained_declarative"
default_placement = "floating"
allowed_placements = ["floating", "docked", "fullscreen", "hidden"]
focusable = true
maximum_instances = 4
context = "dashboard"
command = "plugin.demo.open"

[[plugin.contributions.content_types]]
id = "plugin.demo.private"
title = "Target private"
presenter = "private_cells"
default_placement = "floating"
allowed_placements = ["floating", "docked", "fullscreen", "hidden"]
focusable = true
maximum_instances = 10
context = "dashboard"
command = "plugin.demo.openprivate"

[plugin.contributions.content_types.private_cells]
maximum_cells = 128
maximum_patch_cells = 32
maximum_dirty_rectangles = 8
maximum_styles = 8
maximum_hit_regions = 8
maximum_bytes = 4096
cursor = true
